[Core.System]
; Version guard: this project targets UE 5.7.0.
; A diff on EngineVersion signals an unintended engine version change —
; treat it as a breaking change requiring a migration plan before merging.
EngineVersion=5.7.0

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
; Lumen GI + Lumen Reflections (UE5.5 defaults for high-quality desktop)
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1

; ── Skeleton compatibility note (UE 5.5 + Lyra) ──────────────────────────────
; USkeleton CompatibleSkeletons is an asset-level property stored per .uasset,
; NOT an ini setting. After any engine upgrade, verify these Lyra skeleton assets
; did not auto-upgrade their serialization format:
;
;   Content/Characters/Heroes/Mannequin/Meshes/SK_Mannequin.uasset
;   Content/Characters/Heroes/Mannequin/Meshes/SK_Mannequin_Female.uasset
;
; NOTE: Lyra skeleton paths may change between UE 5.5 → 5.7. Verify after migration.
;
; Verification: UE Editor → Skeleton asset → Retarget Manager
;               Confirm all CompatibleSkeletons entries still resolve correctly.
; ─────────────────────────────────────────────────────────────────────────────
