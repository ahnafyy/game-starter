[project]
name = "game-starter-agents"
version = "0.1.0"
description = "Multi-agent dev workflow for the GameStarter Unreal project"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.0.0",
    "anyio>=4.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "openai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
game-agent = "agents.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agents", "tests"]
