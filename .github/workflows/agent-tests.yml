name: Agent Tests

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  lint-and-test:
    name: Lint + Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # Agents don't need the UE submodule

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check agents/ tests/ tools/

      - name: Run tests
        run: uv run pytest tests/ --tb=short -q
